<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Stream Puro • Portadas Reales</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color: #09090b;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header { text-align:center; margin-bottom:30px; }
        h1 {
            color: #00d2ff;
            font-size: clamp(2rem,8vw,2.8rem);
            font-weight:900;
            letter-spacing:4px;
            text-shadow: 0 0 10px rgba(0,210,255,0.6), 0 0 20px rgba(0,210,255,0.4);
        }
        .subtitle {
            color: #a1a1aa;
            font-size:0.75rem;
            text-transform:uppercase;
            letter-spacing:2px;
            margin-top:5px;
        }
        .panel {
            background-color: #18181b;
            border:1px solid #27272a;
            border-radius:20px;
            padding:25px 20px;
            width:100%;
            max-width:950px;
        }
        .search-box { display:flex; gap:10px; max-width:500px; margin:0 auto 20px; }
        input {
            flex:1;
            background:#27272a;
            border:1px solid #3f3f46;
            border-radius:12px;
            padding:12px 16px;
            color:white;
            font-size:1rem;
            outline:none;
        }
        input:focus { border-color:#00d2ff; }
        button {
            background:#00a3cc;
            color:white;
            border:none;
            border-radius:12px;
            padding:0 24px;
            font-weight:bold;
            cursor:pointer;
        }
        button:hover { background:#00d2ff; }
        .results-grid {
            display:grid;
            grid-template-columns: repeat(2,1fr);
            gap:15px;
            margin-top:20px;
        }
        @media(min-width:500px){.results-grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:700px){.results-grid{grid-template-columns:repeat(4,1fr)}}
        @media(min-width:900px){.results-grid{grid-template-columns:repeat(5,1fr)}}
        .card {
            background:#27272a;
            border:1px solid #3f3f46;
            border-radius:15px;
            overflow:hidden;
            cursor:pointer;
            transition: 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color:#00d2ff;
            box-shadow:0 8px 20px rgba(0,210,255,0.3);
        }
        .card img {
            width:100%;
            aspect-ratio:3/4;
            object-fit:cover;
            display:block;
            background:#1a1a1e;
        }
        .card h3 {
            font-size:0.8rem;
            margin:10px 8px;
            color:#e4e4e7;
            text-align:center;
        }
        .video-box {
            margin-top:25px;
            width:100%;
            aspect-ratio:16/9;
            background:black;
            border-radius:15px;
            overflow:hidden;
            border:2px solid rgba(0,210,255,0.4);
        }
        iframe { width:100%; height:100%; border:none; }
        .hidden { display:none!important; }
        .info-msg {
            text-align:center;
            color:#a1a1aa;
            padding:20px;
            grid-column:1/-1;
        }
        .badge {
            display:inline-block;
            background:#00a3cc;
            color:#000;
            font-size:0.6rem;
            padding:2px 6px;
            border-radius:4px;
            margin-left:5px;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>STREAM PURO</h1>
        <div class="subtitle">Catálogo con Portadas Reales • 40 Animes</div>
    </header>

    <div class="panel">
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Buscar: Naruto, Dragon Ball, One Piece..." autofocus>
            <button id="searchBtn">BUSCAR</button>
        </div>

        <div id="results" class="results-grid"></div>

        <div id="videoContainer" class="video-box hidden">
            <iframe id="player" sandbox="allow-scripts allow-same-origin" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        (function() {
            const CATALOGO = [
                { title: "Naruto", image: "https://cdn.myanimelist.net/images/anime/13/17405l.jpg" },
                { title: "Naruto Shippuden", image: "https://cdn.myanimelist.net/images/anime/5/17407l.jpg" },
                { title: "Boruto: Naruto Next Generations", image: "https://cdn.myanimelist.net/images/anime/13/75521l.jpg" },
                { title: "Dragon Ball", image: "https://cdn.myanimelist.net/images/anime/10/82594l.jpg" },
                { title: "Dragon Ball Z", image: "https://cdn.myanimelist.net/images/anime/7/6804l.jpg" },
                { title: "Dragon Ball Super", image: "https://cdn.myanimelist.net/images/anime/7/74673l.jpg" },
                { title: "Dragon Ball GT", image: "https://cdn.myanimelist.net/images/anime/11/20727l.jpg" },
                { title: "One Piece", image: "https://cdn.myanimelist.net/images/anime/6/73245l.jpg" },
                { title: "Demon Slayer", image: "https://cdn.myanimelist.net/images/anime/1286/99889l.jpg" },
                { title: "Attack on Titan", image: "https://cdn.myanimelist.net/images/anime/10/47347l.jpg" },
                { title: "Jujutsu Kaisen", image: "https://cdn.myanimelist.net/images/anime/1171/109222l.jpg" },
                { title: "Chainsaw Man", image: "https://cdn.myanimelist.net/images/anime/1806/126216l.jpg" },
                { title: "Spy x Family", image: "https://cdn.myanimelist.net/images/anime/1441/122795l.jpg" },
                { title: "My Hero Academia", image: "https://cdn.myanimelist.net/images/anime/10/78745l.jpg" },
                { title: "Death Note", image: "https://cdn.myanimelist.net/images/anime/9/9453l.jpg" },
                { title: "Hunter x Hunter (2011)", image: "https://cdn.myanimelist.net/images/anime/11/33657l.jpg" },
                { title: "Fullmetal Alchemist: Brotherhood", image: "https://cdn.myanimelist.net/images/anime/10/50457l.jpg" },
                { title: "Tokyo Ghoul", image: "https://cdn.myanimelist.net/images/anime/5/64449l.jpg" },
                { title: "Sword Art Online", image: "https://cdn.myanimelist.net/images/anime/11/39717l.jpg" },
                { title: "One Punch Man", image: "https://cdn.myanimelist.net/images/anime/12/76049l.jpg" },
                { title: "Black Clover", image: "https://cdn.myanimelist.net/images/anime/2/88336l.jpg" },
                { title: "Bleach", image: "https://cdn.myanimelist.net/images/anime/3/40451l.jpg" },
                { title: "Bleach: Thousand-Year Blood War", image: "https://cdn.myanimelist.net/images/anime/1908/135431l.jpg" },
                { title: "Fairy Tail", image: "https://cdn.myanimelist.net/images/anime/5/18179l.jpg" },
                { title: "Haikyuu!!", image: "https://cdn.myanimelist.net/images/anime/7/76014l.jpg" },
                { title: "Steins;Gate", image: "https://cdn.myanimelist.net/images/anime/5/73199l.jpg" },
                { title: "Re:Zero", image: "https://cdn.myanimelist.net/images/anime/11/79410l.jpg" },
                { title: "KonoSuba", image: "https://cdn.myanimelist.net/images/anime/8/77831l.jpg" },
                { title: "Mob Psycho 100", image: "https://cdn.myanimelist.net/images/anime/8/80356l.jpg" },
                { title: "Vinland Saga", image: "https://cdn.myanimelist.net/images/anime/1500/103005l.jpg" },
                { title: "Dr. Stone", image: "https://cdn.myanimelist.net/images/anime/1613/102576l.jpg" },
                { title: "Code Geass", image: "https://cdn.myanimelist.net/images/anime/5/50331l.jpg" },
                { title: "Cowboy Bebop", image: "https://cdn.myanimelist.net/images/anime/4/19644l.jpg" },
                { title: "Neon Genesis Evangelion", image: "https://cdn.myanimelist.net/images/anime/11/19846l.jpg" },
                { title: "Berserk (1997)", image: "https://cdn.myanimelist.net/images/anime/10/21227l.jpg" },
                { title: "Blue Lock", image: "https://cdn.myanimelist.net/images/anime/1258/126929l.jpg" },
                { title: "Tokyo Revengers", image: "https://cdn.myanimelist.net/images/anime/1839/113331l.jpg" },
                { title: "Kaguya-sama: Love is War", image: "https://cdn.myanimelist.net/images/anime/1295/106551l.jpg" },
                { title: "Overlord", image: "https://cdn.myanimelist.net/images/anime/7/88019l.jpg" },
                { title: "No Game No Life", image: "https://cdn.myanimelist.net/images/anime/5/65187l.jpg" }
            ];

            const searchInput = document.getElementById('searchQuery');
            const searchBtn = document.getElementById('searchBtn');
            const resultsDiv = document.getElementById('results');
            const videoContainer = document.getElementById('videoContainer');
            const playerIframe = document.getElementById('player');

            function mostrarCatalogo(filtro = '') {
                resultsDiv.innerHTML = '';
                const filtradas = CATALOGO.filter(a => 
                    a.title.toLowerCase().includes(filtro.toLowerCase())
                );

                if(filtradas.length === 0) {
                    resultsDiv.innerHTML = '<div class="info-msg">❌ No se encontró nada con ese nombre. Prueba otra búsqueda.</div>';
                    return;
                }

                filtradas.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => reproducirDemo(anime.title);
                    card.innerHTML = `
                        <img src="${anime.image}" alt="${anime.title}" loading="lazy"
                             onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22400%22%3E%3Crect fill=%22%231a1a2e%22 width=%22300%22 height=%22400%22/%3E%3Ctext fill=%22%2300d2ff%22 x=%2230%22 y=%22200%22 font-size=%2220%22%3E${encodeURIComponent(anime.title.substring(0,15))}%3C/text%3E%3C/svg%3E';">
                        <h3>${anime.title}</h3>
                    `;
                    resultsDiv.appendChild(card);
                });
            }

            function reproducirDemo(titulo) {
                const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;font-family:sans-serif;}
h2{color:#00d2ff;text-align:center;margin-bottom:10px;}
p{color:#a1a1aa;text-align:center;font-size:0.9rem;}
.icon{font-size:4rem;margin-bottom:20px;}
</style></head>
<body>
<div class="icon">🎬</div>
<h2>${titulo}</h2>
<p>Reproductor listo • Próximamente videos reales</p>
</body></html>`;
                const blob = new Blob([html], {type:'text/html'});
                const blobUrl = URL.createObjectURL(blob);
                if(playerIframe.src.startsWith('blob:')) URL.revokeObjectURL(playerIframe.src);
                playerIframe.src = blobUrl;
                videoContainer.classList.remove('hidden');
                videoContainer.scrollIntoView({ behavior:'smooth', block:'center' });
            }

            searchBtn.addEventListener('click', () => mostrarCatalogo(searchInput.value.trim()));
            searchInput.addEventListener('keypress', e => {
                if(e.key === 'Enter') mostrarCatalogo(searchInput.value.trim());
            });
            searchInput.addEventListener('input', () => mostrarCatalogo(searchInput.value.trim()));

            // Cargar todo al abrir
            mostrarCatalogo();
        })();
    </script>
</body>
</html>
