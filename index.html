<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Stream Puro • Catálogo Premium</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color: #09090b;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header { text-align:center; margin-bottom:30px; }
        h1 {
            color: #00d2ff;
            font-size: clamp(2rem,8vw,2.8rem);
            font-weight:900;
            letter-spacing:4px;
            text-shadow: 0 0 10px rgba(0,210,255,0.6), 0 0 20px rgba(0,210,255,0.4);
        }
        .subtitle {
            color: #a1a1aa;
            font-size:0.75rem;
            text-transform:uppercase;
            letter-spacing:2px;
            margin-top:5px;
        }
        .panel {
            background-color: #18181b;
            border:1px solid #27272a;
            border-radius:20px;
            padding:25px 20px;
            width:100%;
            max-width:950px;
        }
        .search-box { display:flex; gap:10px; max-width:500px; margin:0 auto 20px; }
        input {
            flex:1;
            background:#27272a;
            border:1px solid #3f3f46;
            border-radius:12px;
            padding:12px 16px;
            color:white;
            font-size:1rem;
            outline:none;
        }
        input:focus { border-color:#00d2ff; }
        button {
            background:#00a3cc;
            color:white;
            border:none;
            border-radius:12px;
            padding:0 24px;
            font-weight:bold;
            cursor:pointer;
        }
        button:hover { background:#00d2ff; }
        .results-grid {
            display:grid;
            grid-template-columns: repeat(2,1fr);
            gap:15px;
            margin-top:20px;
        }
        @media(min-width:500px){.results-grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:700px){.results-grid{grid-template-columns:repeat(4,1fr)}}
        @media(min-width:900px){.results-grid{grid-template-columns:repeat(5,1fr)}}
        .card {
            background:#27272a;
            border:1px solid #3f3f46;
            border-radius:15px;
            overflow:hidden;
            cursor:pointer;
            transition: 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color:#00d2ff;
            box-shadow:0 8px 20px rgba(0,210,255,0.3);
        }
        /* Portada con gradiente + emoji decorativo (siempre visible) */
        .cover {
            width:100%;
            aspect-ratio:3/4;
            background: linear-gradient(145deg, #0b1e2e 0%, #0a2a3c 40%, #061621 100%);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:3rem;
            position:relative;
            overflow:hidden;
        }
        .cover::after {
            content:"";
            position:absolute;
            bottom:8px;
            right:8px;
            font-size:1.8rem;
            opacity:0.6;
        }
        .card h3 {
            font-size:0.8rem;
            margin:10px 8px;
            color:#e4e4e7;
            text-align:center;
        }
        .video-box {
            margin-top:25px;
            width:100%;
            aspect-ratio:16/9;
            background:black;
            border-radius:15px;
            overflow:hidden;
            border:2px solid rgba(0,210,255,0.4);
        }
        iframe { width:100%; height:100%; border:none; }
        .hidden { display:none!important; }
        .info-msg {
            text-align:center;
            color:#00d2ff;
            padding:20px;
            font-size:0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>STREAM PURO</h1>
        <div class="subtitle">Catálogo Premium • Sin Errores</div>
    </header>

    <div class="panel">
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Buscar anime... (ej: Naruto)" autofocus>
            <button id="searchBtn">BUSCAR</button>
        </div>

        <!-- Resultados de búsqueda -->
        <div id="results" class="results-grid"></div>

        <!-- Reproductor (simulado por ahora) -->
        <div id="videoContainer" class="video-box hidden">
            <iframe id="player" sandbox="allow-scripts allow-same-origin" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        (function() {
            // Catálogo fijo con 40 animes populares (sin depender de internet)
            const CATALOGO = [
                { title: "Naruto Shippuden", emoji: "🍥" },
                { title: "One Piece", emoji: "🏴‍☠️" },
                { title: "Demon Slayer", emoji: "👹" },
                { title: "Attack on Titan", emoji: "⚔️" },
                { title: "Dragon Ball Super", emoji: "🐉" },
                { title: "Bleach TYBW", emoji: "🗡️" },
                { title: "Jujutsu Kaisen", emoji: "🔮" },
                { title: "Chainsaw Man", emoji: "⛓️" },
                { title: "Spy x Family", emoji: "🕵️" },
                { title: "My Hero Academia", emoji: "💥" },
                { title: "Death Note", emoji: "📓" },
                { title: "Hunter x Hunter", emoji: "🎣" },
                { title: "Fullmetal Alchemist", emoji: "⚙️" },
                { title: "Tokyo Ghoul", emoji: "👁️" },
                { title: "Sword Art Online", emoji: "🗡️" },
                { title: "One Punch Man", emoji: "👊" },
                { title: "Black Clover", emoji: "🍀" },
                { title: "Fairy Tail", emoji: "🔥" },
                { title: "Haikyuu!!", emoji: "🏐" },
                { title: "Steins;Gate", emoji: "⏳" },
                { title: "Re:Zero", emoji: "🔄" },
                { title: "KonoSuba", emoji: "💧" },
                { title: "Mob Psycho 100", emoji: "🌀" },
                { title: "Vinland Saga", emoji: "🪓" },
                { title: "Dr. Stone", emoji: "🪨" },
                { title: "The Promised Neverland", emoji: "🏃" },
                { title: "Code Geass", emoji: "👁️" },
                { title: "Cowboy Bebop", emoji: "🚀" },
                { title: "Neon Genesis Evangelion", emoji: "🤖" },
                { title: "Berserk", emoji: "⚫" },
                { title: "Made in Abyss", emoji: "🕳️" },
                { title: "Psycho-Pass", emoji: "🔫" },
                { title: "Parasyte", emoji: "🦠" },
                { title: "Noragami", emoji: "⛩️" },
                { title: "Blue Lock", emoji: "⚽" },
                { title: "Tokyo Revengers", emoji: "🏍️" },
                { title: "Kaguya-sama: Love is War", emoji: "💘" },
                { title: "Mushoku Tensei", emoji: "✨" },
                { title: "Overlord", emoji: "💀" },
                { title: "No Game No Life", emoji: "🎮" }
            ];

            const searchInput = document.getElementById('searchQuery');
            const searchBtn = document.getElementById('searchBtn');
            const resultsDiv = document.getElementById('results');
            const videoContainer = document.getElementById('videoContainer');
            const playerIframe = document.getElementById('player');

            // Colores de fondo para las portadas (para que cada una se vea diferente)
            const colores = [
                'linear-gradient(145deg, #0b1e2e, #0a2a3c, #061621)',
                'linear-gradient(145deg, #1e0b0b, #3c0a0a, #210606)',
                'linear-gradient(145deg, #0b1e0b, #0a3c0a, #062106)',
                'linear-gradient(145deg, #1e1e0b, #3c3c0a, #212106)',
                'linear-gradient(145deg, #1e0b1e, #3c0a3c, #210621)',
                'linear-gradient(145deg, #0b1e1e, #0a3c3c, #062121)'
            ];

            // Mostrar todo el catálogo al cargar
            function mostrarCatalogo(filtro = '') {
                resultsDiv.innerHTML = '';
                const filtradas = CATALOGO.filter(a => 
                    a.title.toLowerCase().includes(filtro.toLowerCase())
                );

                if(filtradas.length === 0) {
                    resultsDiv.innerHTML = '<div class="info-msg">No se encontró nada. Prueba otro nombre.</div>';
                    return;
                }

                filtradas.forEach((anime, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => reproducirDemo(anime.title);
                    card.innerHTML = `
                        <div class="cover" style="background:${colores[index % colores.length]}">
                            <span style="font-size:3rem;">${anime.emoji}</span>
                        </div>
                        <h3>${anime.title}</h3>
                    `;
                    resultsDiv.appendChild(card);
                });
            }

            function reproducirDemo(titulo) {
                // Por ahora mostramos un placeholder elegante
                const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;font-family:sans-serif;}
h2{color:#00d2ff;text-align:center;margin-bottom:10px;}
p{color:#a1a1aa;text-align:center;font-size:0.9rem;}
.icon{font-size:4rem;margin-bottom:20px;}
</style></head>
<body>
<div class="icon">🎬</div>
<h2>${titulo}</h2>
<p>Reproductor listo • Próximamente videos reales</p>
</body></html>`;
                const blob = new Blob([html], {type:'text/html'});
                const blobUrl = URL.createObjectURL(blob);
                if(playerIframe.src.startsWith('blob:')) URL.revokeObjectURL(playerIframe.src);
                playerIframe.src = blobUrl;
                videoContainer.classList.remove('hidden');
                videoContainer.scrollIntoView({ behavior:'smooth', block:'center' });
            }

            // Eventos
            searchBtn.addEventListener('click', () => mostrarCatalogo(searchInput.value.trim()));
            searchInput.addEventListener('keypress', e => {
                if(e.key === 'Enter') mostrarCatalogo(searchInput.value.trim());
            });
            // Filtro en tiempo real mientras escribe
            searchInput.addEventListener('input', () => mostrarCatalogo(searchInput.value.trim()));

            // Cargar catálogo al abrir la página
            mostrarCatalogo();
        })();
    </script>
</body>
</html>
