<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Stream Puro • Funcional</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color: #09090b;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header { text-align:center; margin-bottom:30px; }
        h1 {
            color: #00d2ff;
            font-size: clamp(2rem,8vw,2.8rem);
            font-weight:900;
            letter-spacing:4px;
            text-shadow: 0 0 10px rgba(0,210,255,0.6), 0 0 20px rgba(0,210,255,0.4);
        }
        .subtitle {
            color: #a1a1aa;
            font-size:0.75rem;
            text-transform:uppercase;
            letter-spacing:2px;
            margin-top:5px;
        }
        .panel {
            background-color: #18181b;
            border:1px solid #27272a;
            border-radius:20px;
            padding:25px 20px;
            width:100%;
            max-width:950px;
        }
        .search-box { display:flex; gap:10px; max-width:500px; margin:0 auto 20px; }
        input {
            flex:1;
            background:#27272a;
            border:1px solid #3f3f46;
            border-radius:12px;
            padding:12px 16px;
            color:white;
            font-size:1rem;
            outline:none;
        }
        input:focus { border-color:#00d2ff; }
        button {
            background:#00a3cc;
            color:white;
            border:none;
            border-radius:12px;
            padding:0 24px;
            font-weight:bold;
            cursor:pointer;
        }
        button:hover { background:#00d2ff; }
        .loader {
            text-align:center;
            color:#00d2ff;
            margin:20px 0;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
        }
        .loader::before {
            content:"";
            width:18px; height:18px;
            border:2px solid rgba(0,210,255,0.3);
            border-top-color:#00d2ff;
            border-radius:50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .results-grid {
            display:grid;
            grid-template-columns: repeat(2,1fr);
            gap:15px;
            margin-top:20px;
        }
        @media(min-width:500px){.results-grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:700px){.results-grid{grid-template-columns:repeat(4,1fr)}}
        @media(min-width:900px){.results-grid{grid-template-columns:repeat(5,1fr)}}
        .card {
            background:#27272a;
            border:1px solid #3f3f46;
            border-radius:15px;
            overflow:hidden;
            cursor:pointer;
            transition: 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color:#00d2ff;
            box-shadow:0 8px 20px rgba(0,210,255,0.3);
        }
        .card img {
            width:100%;
            aspect-ratio:3/4;
            object-fit:cover;
            background:#1a1a1e;
        }
        .card h3 {
            font-size:0.8rem;
            margin:10px 8px;
            color:#e4e4e7;
            text-align:center;
        }
        .episode-menu {
            margin-top:25px;
            background:#0c0c10;
            border:1px solid #27272a;
            padding:20px;
            border-radius:18px;
        }
        .episode-menu h2 { color:#00d2ff; margin-bottom:15px; }
        .grid-buttons {
            display:grid;
            grid-template-columns: repeat(4,1fr);
            gap:8px;
        }
        @media(min-width:500px){.grid-buttons{grid-template-columns:repeat(6,1fr)}}
        @media(min-width:700px){.grid-buttons{grid-template-columns:repeat(8,1fr)}}
        .btn-ep {
            background:#27272a;
            color:white;
            padding:10px;
            border:none;
            border-radius:8px;
            font-weight:bold;
            cursor:pointer;
        }
        .btn-ep:hover { background:#00a3cc; }
        .video-box {
            margin-top:25px;
            width:100%;
            aspect-ratio:16/9;
            background:black;
            border-radius:15px;
            overflow:hidden;
            border:2px solid rgba(0,210,255,0.4);
        }
        iframe { width:100%; height:100%; border:none; }
        .hidden { display:none!important; }
        .error-text {
            color:#f87171;
            text-align:center;
            padding:15px;
            background:rgba(255,0,0,0.1);
            border-radius:10px;
            margin:15px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>STREAM PURO</h1>
        <div class="subtitle">Aislamiento Total • Búsqueda Real</div>
    </header>

    <div class="panel">
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Ej: One Piece, Naruto..." autofocus>
            <button id="searchBtn">BUSCAR</button>
        </div>

        <div id="results" class="results-grid hidden"></div>
        <div id="searchLoader" class="loader hidden">Buscando anime...</div>
        <div id="searchError" class="error-text hidden"></div>

        <div id="episodeMenu" class="episode-menu hidden">
            <h2 id="animeTitle">Capítulos</h2>
            <div id="episodeList" class="grid-buttons"></div>
            <div id="episodeLoader" class="loader hidden">Cargando episodios...</div>
        </div>

        <div id="videoContainer" class="video-box hidden">
            <iframe id="player" sandbox="allow-scripts allow-same-origin" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        (function() {
            const searchInput = document.getElementById('searchQuery');
            const searchBtn = document.getElementById('searchBtn');
            const resultsDiv = document.getElementById('results');
            const searchLoader = document.getElementById('searchLoader');
            const searchError = document.getElementById('searchError');
            const episodeMenu = document.getElementById('episodeMenu');
            const episodeTitle = document.getElementById('animeTitle');
            const episodeList = document.getElementById('episodeList');
            const episodeLoader = document.getElementById('episodeLoader');
            const videoContainer = document.getElementById('videoContainer');
            const playerIframe = document.getElementById('player');

            // API Anify (funciona sin proxy, sin CORS, gratis)
            const ANIFY_SEARCH = 'https://api.anify.tv/search?query=';

            async function searchAnime(query) {
                if(!query) return;
                resultsDiv.classList.add('hidden');
                episodeMenu.classList.add('hidden');
                videoContainer.classList.add('hidden');
                searchError.classList.add('hidden');
                searchLoader.classList.remove('hidden');

                try {
                    const response = await fetch(ANIFY_SEARCH + encodeURIComponent(query));
                    if(!response.ok) throw new Error('Error');
                    const data = await response.json();
                    if(!data || data.length === 0) {
                        showSearchError('No se encontró nada. Prueba otro nombre.');
                        return;
                    }
                    renderResults(data);
                } catch(err) {
                    showSearchError('Error de conexión. Revisa tu internet.');
                } finally {
                    searchLoader.classList.add('hidden');
                }
            }

            function showSearchError(msg) {
                searchError.textContent = msg;
                searchError.classList.remove('hidden');
                resultsDiv.innerHTML = '';
                resultsDiv.classList.add('hidden');
            }

            function renderResults(animes) {
                resultsDiv.innerHTML = '';
                animes.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => loadEpisodes(anime.id, anime.title);
                    card.innerHTML = `
                        <img src="${anime.coverImage || anime.image || ''}" alt="${anime.title}"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22200%22%3E%3Crect fill=%22%23333%22 width=%22150%22 height=%22200%22/%3E%3Ctext fill=%22%2300d2ff%22 x=%2220%22 y=%22100%22 font-size=%2214%22%3EImg%3C/text%3E%3C/svg%3E'">
                        <h3>${anime.title.romaji || anime.title.english || anime.title.native || 'Sin título'}</h3>
                    `;
                    resultsDiv.appendChild(card);
                });
                resultsDiv.classList.remove('hidden');
            }

            async function loadEpisodes(animeId, title) {
                episodeMenu.classList.add('hidden');
                videoContainer.classList.add('hidden');
                episodeLoader.classList.remove('hidden');

                try {
                    // Anify devuelve info + episodios
                    const res = await fetch(`https://api.anify.tv/info/${animeId}`);
                    const data = await res.json();
                    if(!data.episodes || data.episodes.length === 0) {
                        alert('Este anime no tiene episodios aún.');
                        return;
                    }
                    renderEpisodes(data.episodes, title);
                } catch(e) {
                    alert('Error al cargar episodios.');
                } finally {
                    episodeLoader.classList.add('hidden');
                }
            }

            function renderEpisodes(episodes, title) {
                episodeTitle.textContent = title;
                episodeList.innerHTML = '';
                // Limitamos a 50 para no saturar
                const maxEps = episodes.slice(0, 50);
                maxEps.forEach(ep => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-ep';
                    btn.textContent = ep.number;
                    btn.onclick = () => playEpisode(ep.id, ep.number);
                    episodeList.appendChild(btn);
                });
                episodeMenu.classList.remove('hidden');
                episodeMenu.scrollIntoView({ behavior:'smooth' });
            }

            async function playEpisode(epId, epNum) {
                videoContainer.classList.add('hidden');
                episodeLoader.classList.remove('hidden');
                episodeLoader.textContent = 'Preparando reproductor seguro...';

                try {
                    const res = await fetch(`https://api.anify.tv/watch/${epId}`);
                    const data = await res.json();
                    if(!data.sources || data.sources.length === 0) {
                        alert('No hay fuente disponible.');
                        return;
                    }
                    // Tomamos la primera fuente de video
                    const videoUrl = data.sources[0].url;
                    const safeHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}video{width:100%;height:100%;max-height:100vh;}</style></head><body><video controls autoplay playsinline src="${videoUrl}"></video></body></html>`;
                    const blob = new Blob([safeHtml], {type:'text/html'});
                    const blobUrl = URL.createObjectURL(blob);
                    if(playerIframe.src.startsWith('blob:')) URL.revokeObjectURL(playerIframe.src);
                    playerIframe.src = blobUrl;
                    videoContainer.classList.remove('hidden');
                    videoContainer.scrollIntoView({ behavior:'smooth', block:'center' });
                } catch(e) {
                    alert('Error al cargar el video.');
                } finally {
                    episodeLoader.classList.add('hidden');
                }
            }

            searchBtn.addEventListener('click', () => searchAnime(searchInput.value.trim()));
            searchInput.addEventListener('keypress', e => {
                if(e.key === 'Enter') searchAnime(searchInput.value.trim());
            });
        })();
    </script>
</body>
</html>
