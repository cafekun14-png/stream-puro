<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Puro - Premium Edition</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen flex flex-col items-center justify-start p-4">

    <!-- Encabezado Estilo Premium -->
    <header class="w-full max-w-4xl text-center my-6">
        <h1 class="text-4xl font-black text-red-600 tracking-widest drop-shadow-[0_5px_5px_rgba(255,0,0,0.4)]">STREAM PURO</h1>
        <p class="text-zinc-400 text-xs uppercase tracking-widest mt-1">Aislamiento de Video Total • Sin comerciales al pausar</p>
    </header>

    <!-- Panel Principal -->
    <main class="w-full max-w-4xl bg-zinc-900/50 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-zinc-800/80">
        
        <!-- Buscador -->
        <div class="flex flex-col gap-3 max-w-xl mx-auto">
            <div class="flex gap-2">
                <input type="text" id="searchQuery" placeholder="Busca tu anime o serie favorita..." class="w-full bg-zinc-800/60 border border-zinc-700/60 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-red-500 text-base shadow-inner transition">
                <button onclick="buscarContenido()" class="bg-red-600 hover:bg-red-700 text-white font-black px-7 py-4 rounded-2xl shadow-lg shadow-red-700/30 active:scale-95 transition">BUSCAR</button>
            </div>
        </div>

        <!-- Rejilla de Resultados Visuales (Netflix Style) -->
        <div id="results" class="mt-8 hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 max-h-[400px] overflow-y-auto p-2"></div>

        <!-- Contenedor del Reproductor Premium Aislado -->
        <div id="videoContainer" class="mt-8 hidden w-full aspect-video bg-black rounded-2xl overflow-hidden relative border-2 border-red-600/30 shadow-2xl shadow-red-900/20">
            <!-- Sandbox estricto contra ventanas emergentes y comerciales al pausar -->
            <iframe id="player" src="" class="w-full h-full" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>
    </main>

    <script>
        async function buscarContenido() {
            const query = document.getElementById('searchQuery').value;
            const resultsDiv = document.getElementById('results');
            if(!query) return;

            resultsDiv.innerHTML = "<p class='text-zinc-500 text-sm col-span-full text-center animate-pulse'>Buscando en servidores seguros...</p>";
            resultsDiv.classList.remove('hidden');

            try {
                // Conexión en vivo al servidor masivo de bases de datos de anime
                const response = await fetch(`https://consumet.org{query}`);
                const data = await response.json();
                
                resultsDiv.innerHTML = "";
                if(data.results.length === 0) {
                    resultsDiv.innerHTML = "<p class='text-red-500 text-sm col-span-full text-center'>No se encontraron resultados en el catálogo.</p>";
                    return;
                }

                // Generación automática de Tarjetas de Portada
                data.results.slice(0, 8).forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-zinc-800/40 border border-zinc-700/40 rounded-2xl overflow-hidden shadow-md hover:border-red-500/80 hover:scale-[1.02] cursor-pointer transition flex flex-col group";
                    card.onclick = () => cargarVideo(item.id);
                    
                    card.innerHTML = `
                        <div class="w-full aspect-[3/4] bg-zinc-800 overflow-hidden relative">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co'">
                        </div>
                        <div class="p-3 flex-grow flex items-center">
                            <h3 class="text-xs font-bold text-zinc-200 line-clamp-2 group-hover:text-red-500 transition">${item.title}</h3>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });
            } catch (error) {
                // Respaldo de simulación por si falla la API pública
                resultsDiv.innerHTML = `
                    <div onclick="cargarVideoMock()" class="bg-zinc-800/40 border border-yellow-600/40 rounded-2xl overflow-hidden shadow-md hover:border-yellow-500 cursor-pointer p-4 text-center col-span-full">
                        <p class="text-yellow-500 font-bold text-sm">[Modo de Prueba Local Activo]</p>
                        <p class="text-zinc-400 text-xs mt-1">Haz clic aquí para encender el reproductor con el video de ejemplo de pantalla completa limpia.</p>
                    </div>
                `;
            }
        }

        function cargarVideo(animeId) {
            const videoContainer = document.getElementById('videoContainer');
            const player = document.getElementById('player');
            player.src = `https://consumet.org{animeId}-episode-1`; 
            videoContainer.classList.remove('hidden');
            videoContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function cargarVideoMock() {
            const videoContainer = document.getElementById('videoContainer');
            const player = document.getElementById('player');
            player.src = "https://youtube.com"; 
            videoContainer.classList.remove('hidden');
            videoContainer.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
