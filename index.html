<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Puro - Panel de Desarrollo Azul</title>
    <style>
        /* Diseño Nativo Estilo Cyberpunk / Azul Neón */
        body {
            background-color: #09090b;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #00d2ff;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0;
            /* Luces neón y resplandor azul */
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6), 0 0 20px rgba(0, 210, 255, 0.4);
        }
        .subtitle {
            color: #a1a1aa;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        .panel {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .search-box {
            display: flex;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        input {
            flex-grow: 1;
            background-color: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }
        button {
            background-color: #00a3cc;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        button:hover {
            background-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
        .results-grid {
            display: grid;
            grid-template-cols: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        @media(min-width: 640px) {
            .results-grid { grid-template-cols: repeat(4, 1fr); }
        }
        .card {
            background-color: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: scale(1.03);
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }
        .card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            display: block;
        }
        .card h3 {
            font-size: 0.8rem;
            margin: 10px;
            color: #e4e4e7;
            text-align: center;
        }
        .menu-episodes {
            margin-top: 30px;
            background-color: #09090b;
            border: 1px solid #27272a;
            padding: 20px;
            border-radius: 15px;
        }
        .menu-episodes h2 {
            font-size: 1.2rem;
            color: #00d2ff;
            margin-top: 0;
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.3);
        }
        .grid-buttons {
            display: grid;
            grid-template-cols: repeat(4, 1fr);
            gap: 8px;
        }
        @media(min-width: 640px) {
            .grid-buttons { grid-template-cols: repeat(8, 1fr); }
        }
        .btn-ep {
            background-color: #27272a;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .btn-ep:hover {
            background-color: #00a3cc;
        }
        .video-box {
            margin-top: 30px;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: black;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .hidden { display: none !important; }
        .aviso {
            color: #00d2ff;
            background-color: rgba(0, 163, 204, 0.1);
            border: 1px solid #00a3cc;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            text-align: center;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <h1>STREAM PURO</h1>
        <div class="subtitle">Aislamiento de Video Total • Edición Azul Neón</div>
    </header>

    <div class="panel">
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Escribe cualquier nombre de anime...">
            <button onclick="buscarContenido()">BUSCAR</button>
        </div>

        <!-- Catálogo masivo de portadas -->
        <div id="results" class="results-grid hidden"></div>

        <!-- Menú de Episodios -->
        <div id="episodeMenu" class="menu-episodes hidden">
            <h2 id="animeTitle">Capítulos Disponibles:</h2>
            <div id="episodeList" class="grid-buttons"></div>
        </div>

        <!-- Reproductor Protegido -->
        <div id="videoContainer" class="video-box hidden">
            <iframe id="player" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>
    </div>

    <script>
        let currentAnimeId = "";

        function buscarContenido() {
            const query = document.getElementById('searchQuery').value.trim();
            const resultsDiv = document.getElementById('results');
            document.getElementById('episodeMenu').classList.add('hidden');
            document.getElementById('videoContainer').classList.add('hidden');
            if(!query) return;

            resultsDiv.innerHTML = "";
            resultsDiv.classList.remove('hidden');

            // Catálogo masivo de 12 animes con imágenes estables e independientes de alta velocidad
            const animesEjemplo = [
                { id: "naruto", title: "Naruto Shippuden", img: "https://picsum.photos" },
                { id: "one-piece", title: "One Piece", img: "https://picsum.photos gay/300/400" },
                { id: "demon-slayer", title: "Demon Slayer", img: "https://picsum.photos" },
                { id: "attack-on-titan", title: "Attack on Titan", img: "https://picsum.photos" },
                { id: "dragon-ball", title: "Dragon Ball Super", img: "https://picsum.photos" },
                { id: "bleach", title: "Bleach: TYBW", img: "https://picsum.photos" },
                { id: "my-hero-academia", title: "My Hero Academia", img: "https://picsum.photos" },
                { id: "jujutsu-kaisen", title: "Jujutsu Kaisen", img: "https://picsum.photos" },
                { id: "chainsaw-man", title: "Chainsaw Man", img: "https://picsum.photos" },
                { id: "death-note", title: "Death Note", img: "https://picsum.photos" },
                { id: "hunter-x-hunter", title: "Hunter x Hunter", img: "https://picsum.photos" },
                { id: "tokyo-ghoul", title: "Tokyo Ghoul", img: "https://picsum.photos" }
            ];

            // Ajuste dinámico de los enlaces de imágenes de prueba estables
            animesEjemplo.forEach((item, index) => {
                item.img = `https://picsum.photos{item.id}/300/400`;
            });

            const aviso = document.createElement('div');
            aviso.className = "aviso";
            aviso.innerText = `[Catálogo Masivo Listo] Mostrando 12 resultados premium para tu búsqueda: "${query}"`;
            resultsDiv.appendChild(aviso);

            animesEjemplo.forEach(item => {
                const card = document.createElement('div');
                card.className = "card";
                card.onclick = () => desplegarEpisodios(item.id, item.title);
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <h3>${item.title}</h3>
                `;
                resultsDiv.appendChild(card);
            });
        }

        function desplegarEpisodios(animeId, animeTitle) {
            currentAnimeId = animeId;
            const menu = document.getElementById('episodeMenu');
            const list = document.getElementById('episodeList');
            document.getElementById('animeTitle').innerText = animeTitle;
            
            list.innerHTML = "";
            for(let i = 1; i <= 24; i++) { // Expandido a 24 episodios por serie
                const epBtn = document.createElement('button');
                epBtn.className = "btn-ep";
                epBtn.innerText = `Ep ${i}`;
                epBtn.onclick = () => cargarVideo(i);
                list.appendChild(epBtn);
            }
            menu.classList.remove('hidden');
        }

        function cargarVideo(episodeNum) {
            const videoContainer = document.getElementById('videoContainer');
