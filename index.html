<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Stream Puro</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color: #09090b;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header { text-align:center; margin-bottom:30px; }
        h1 {
            color: #00d2ff;
            font-size: clamp(2rem,8vw,2.8rem);
            font-weight:900;
            letter-spacing:4px;
            text-shadow: 0 0 10px rgba(0,210,255,0.6), 0 0 20px rgba(0,210,255,0.4);
        }
        .subtitle {
            color: #a1a1aa;
            font-size:0.75rem;
            text-transform:uppercase;
            letter-spacing:2px;
            margin-top:5px;
        }
        .panel {
            background-color: #18181b;
            border:1px solid #27272a;
            border-radius:20px;
            padding:25px 20px;
            width:100%;
            max-width:950px;
        }
        .search-box { display:flex; gap:10px; max-width:500px; margin:0 auto 20px; }
        input {
            flex:1;
            background:#27272a;
            border:1px solid #3f3f46;
            border-radius:12px;
            padding:12px 16px;
            color:white;
            font-size:1rem;
            outline:none;
        }
        input:focus { border-color:#00d2ff; }
        button {
            background:#00a3cc;
            color:white;
            border:none;
            border-radius:12px;
            padding:0 24px;
            font-weight:bold;
            cursor:pointer;
        }
        button:hover { background:#00d2ff; }
        .results-grid {
            display:grid;
            grid-template-columns: repeat(2,1fr);
            gap:15px;
            margin-top:20px;
        }
        @media(min-width:500px){.results-grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:700px){.results-grid{grid-template-columns:repeat(4,1fr)}}
        @media(min-width:900px){.results-grid{grid-template-columns:repeat(5,1fr)}}
        .card {
            background:#27272a;
            border:1px solid #3f3f46;
            border-radius:15px;
            overflow:hidden;
            cursor:pointer;
            transition: 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color:#00d2ff;
            box-shadow:0 8px 20px rgba(0,210,255,0.3);
        }
        .card img {
            width:100%;
            aspect-ratio:3/4;
            object-fit:cover;
            display:block;
            background:#1a1a1e;
        }
        .card h3 {
            font-size:0.8rem;
            margin:10px 8px;
            color:#e4e4e7;
            text-align:center;
        }
        .video-box {
            margin-top:25px;
            width:100%;
            aspect-ratio:16/9;
            background:black;
            border-radius:15px;
            overflow:hidden;
            border:2px solid rgba(0,210,255,0.4);
        }
        iframe { width:100%; height:100%; border:none; }
        .hidden { display:none!important; }
        .info-msg {
            text-align:center;
            color:#a1a1aa;
            padding:20px;
            grid-column:1/-1;
        }
    </style>
</head>
<body>
    <header>
        <h1>STREAM PURO</h1>
        <div class="subtitle">Catálogo con Portadas Reales</div>
    </header>

    <div class="panel">
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Buscar anime..." autofocus>
            <button id="searchBtn">BUSCAR</button>
        </div>

        <div id="results" class="results-grid"></div>

        <div id="videoContainer" class="video-box hidden">
            <iframe id="player" sandbox="allow-scripts allow-same-origin" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const CATALOGO = [
            { title: "Naruto", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx20-YJ4LNgJY1W2A.jpg" },
            { title: "Naruto Shippuden", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx1735-Tk0Q0WqkGh7M.jpg" },
            { title: "Boruto: Naruto Next Generations", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx101409-4GqFrUWnLxPh.jpg" },
            { title: "Dragon Ball", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx813-2NjU0DGh7ZzC.jpg" },
            { title: "Dragon Ball Z", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx814-4GyJ6oOzFm2Y.jpg" },
            { title: "Dragon Ball Super", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21111-6F3WW7qX4wFc.jpg" },
            { title: "One Piece", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21-YIPkZBPs5tkd.jpg" },
            { title: "Demon Slayer", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx101922-Pv1Eh6wYVq2J.jpg" },
            { title: "Attack on Titan", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx16498-Cah1QvE1R6Bc.jpg" },
            { title: "Jujutsu Kaisen", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx113415-qxBEgJ3Q3KxX.jpg" },
            { title: "Chainsaw Man", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx127230-Flz1NkHpE3cM.jpg" },
            { title: "Spy x Family", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx131827-DkdlKADm5Jq3.jpg" },
            { title: "My Hero Academia", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21856-X4sF9MJgCbL3.jpg" },
            { title: "Death Note", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx1535-5zJ4gJcQxJ1o.jpg" },
            { title: "Hunter x Hunter", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx11061-8G8wJ2YYQ3p1.jpg" },
            { title: "Fullmetal Alchemist: Brotherhood", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx5114-4tJmYQwJqBwR.jpg" },
            { title: "Tokyo Ghoul", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx20605-5xLQxpHJxOo1.jpg" },
            { title: "Sword Art Online", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx11757-8FJJf4QxLJx1.jpg" },
            { title: "One Punch Man", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21087-8G8wJ2YYQ3p1.jpg" },
            { title: "Black Clover", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx98436-9qF4nJxYJxV1.jpg" },
            { title: "Bleach", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx269-8G8wJ2YYQ3p1.jpg" },
            { title: "Bleach: TYBW", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx140753-8qJ5gJqLxJq1.jpg" },
            { title: "Fairy Tail", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx6702-8G8wJ2YYQ3p1.jpg" },
            { title: "Haikyuu!!", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx20464-8G8wJ2YYQ3p1.jpg" },
            { title: "Steins;Gate", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx9253-8G8wJ2YYQ3p1.jpg" },
            { title: "Re:Zero", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21355-8G8wJ2YYQ3p1.jpg" },
            { title: "KonoSuba", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21202-8G8wJ2YYQ3p1.jpg" },
            { title: "Mob Psycho 100", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21507-8G8wJ2YYQ3p1.jpg" },
            { title: "Vinland Saga", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx101348-8G8wJ2YYQ3p1.jpg" },
            { title: "Dr. Stone", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx105333-8G8wJ2YYQ3p1.jpg" },
            { title: "Code Geass", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx1575-8G8wJ2YYQ3p1.jpg" },
            { title: "Cowboy Bebop", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx1-8G8wJ2YYQ3p1.jpg" },
            { title: "Neon Genesis Evangelion", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx30-8G8wJ2YYQ3p1.jpg" },
            { title: "Berserk", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx276-8G8wJ2YYQ3p1.jpg" },
            { title: "Blue Lock", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx137822-8G8wJ2YYQ3p1.jpg" },
            { title: "Tokyo Revengers", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx124871-8G8wJ2YYQ3p1.jpg" },
            { title: "Kaguya-sama: Love is War", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx101921-8G8wJ2YYQ3p1.jpg" },
            { title: "Overlord", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx20832-8G8wJ2YYQ3p1.jpg" },
            { title: "No Game No Life", image: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx19815-8G8wJ2YYQ3p1.jpg" }
        ];

        const searchInput = document.getElementById('searchQuery');
        const searchBtn = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');
        const videoContainer = document.getElementById('videoContainer');
        const playerIframe = document.getElementById('player');

        function mostrarCatalogo(filtro) {
            filtro = filtro || '';
            resultsDiv.innerHTML = '';
            const filtradas = CATALOGO.filter(function(a) {
                return a.title.toLowerCase().includes(filtro.toLowerCase());
            });

            if(filtradas.length === 0) {
                resultsDiv.innerHTML = '<div class="info-msg">No se encontro nada. Prueba otro nombre.</div>';
                return;
            }

            filtradas.forEach(function(anime) {
                var card = document.createElement('div');
                card.className = 'card';
                card.onclick = function() {
                    reproducirDemo(anime.title);
                };
                card.innerHTML = '<img src="' + anime.image + '" alt="' + anime.title + '" loading="lazy" onerror="this.onerror=null; this.src=\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22400%22%3E%3Crect fill=%22%231a1a2e%22 width=%22300%22 height=%22400%22/%3E%3Ctext fill=%22%2300d2ff%22 x=%2230%22 y=%22200%22 font-size=%2218%22%3E' + encodeURIComponent(anime.title.substring(0,12)) + '%3C/text%3E%3C/svg%3E\';"><h3>' + anime.title + '</h3>';
                resultsDiv.appendChild(card);
            });
        }

        function reproducirDemo(titulo) {
            var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;font-family:sans-serif;}h2{color:#00d2ff;text-align:center;margin-bottom:10px;}p{color:#a1a1aa;text-align:center;font-size:0.9rem;}.icon{font-size:4rem;margin-bottom:20px;}</style></head><body><div class="icon">🎬</div><h2>' + titulo + '</h2><p>Reproductor listo</p></body></html>';
            var blob = new Blob([html], {type:'text/html'});
            var blobUrl = URL.createObjectURL(blob);
            if(playerIframe.src.startsWith('blob:')) URL.revokeObjectURL(playerIframe.src);
            playerIframe.src = blobUrl;
            videoContainer.classList.remove('hidden');
            videoContainer.scrollIntoView({ behavior:'smooth', block:'center' });
        }

        searchBtn.addEventListener('click', function() {
            mostrarCatalogo(searchInput.value.trim());
        });
        searchInput.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') mostrarCatalogo(searchInput.value.trim());
        });
        searchInput.addEventListener('input', function() {
            mostrarCatalogo(searchInput.value.trim());
        });

        mostrarCatalogo('');
    </script>
</body>
</html>
