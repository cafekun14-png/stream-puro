<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Stream Puro</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color: #09090b;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header { text-align:center; margin-bottom:30px; }
        h1 {
            color: #00d2ff;
            font-size: clamp(2rem,8vw,2.8rem);
            font-weight:900;
            letter-spacing:4px;
            text-shadow: 0 0 10px rgba(0,210,255,0.6), 0 0 20px rgba(0,210,255,0.4);
        }
        .subtitle {
            color: #a1a1aa;
            font-size:0.75rem;
            text-transform:uppercase;
            letter-spacing:2px;
            margin-top:5px;
        }
        .panel {
            background-color: #18181b;
            border:1px solid #27272a;
            border-radius:20px;
            padding:25px 20px;
            width:100%;
            max-width:950px;
        }
        .search-box { display:flex; gap:10px; max-width:500px; margin:0 auto 20px; }
        input {
            flex:1;
            background:#27272a;
            border:1px solid #3f3f46;
            border-radius:12px;
            padding:12px 16px;
            color:white;
            font-size:1rem;
            outline:none;
        }
        input:focus { border-color:#00d2ff; }
        button {
            background:#00a3cc;
            color:white;
            border:none;
            border-radius:12px;
            padding:0 24px;
            font-weight:bold;
            cursor:pointer;
        }
        button:hover { background:#00d2ff; }
        .btn-sm {
            background:#3f3f46;
            font-size:0.75rem;
            padding:8px 16px;
            margin:0 4px;
        }
        .btn-sm:hover { background:#52525b; }
        .results-grid {
            display:grid;
            grid-template-columns: repeat(2,1fr);
            gap:15px;
            margin-top:20px;
        }
        @media(min-width:500px){.results-grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:700px){.results-grid{grid-template-columns:repeat(4,1fr)}}
        @media(min-width:900px){.results-grid{grid-template-columns:repeat(5,1fr)}}
        .card {
            background:#27272a;
            border:1px solid #3f3f46;
            border-radius:15px;
            overflow:hidden;
            cursor:pointer;
            transition: 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color:#00d2ff;
            box-shadow:0 8px 20px rgba(0,210,255,0.3);
        }
        .card .img-wrap {
            width:100%;
            aspect-ratio:3/4;
            background:#1a1a1e;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            position:relative;
        }
        .card .img-wrap img {
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }
        .card .img-wrap .loading-dot {
            width:10px;height:10px;border-radius:50%;
            background:#00d2ff;
            animation:pulse 1s infinite ease-in-out;
        }
        @keyframes pulse { 0%,100%{opacity:.2} 50%{opacity:1} }
        .card h3 {
            font-size:0.8rem;
            margin:10px 8px 4px;
            color:#e4e4e7;
            text-align:center;
        }
        .card .eps-badge {
            font-size:0.6rem;
            color:#a1a1aa;
            text-align:center;
            margin-bottom:8px;
        }
        .menu-episodes {
            margin-top:25px;
            background-color:#0c0c10;
            border:1px solid #27272a;
            padding:20px 16px;
            border-radius:18px;
        }
        .menu-episodes h2 {
            font-size:1.2rem;
            color:#00d2ff;
            margin-bottom:5px;
            text-shadow: 0 0 5px rgba(0,210,255,0.3);
        }
        .menu-episodes .info-text {
            font-size:0.7rem;
            color:#a1a1aa;
            margin-bottom:15px;
        }
        .grid-buttons {
            display:grid;
            grid-template-columns: repeat(4,1fr);
            gap:8px;
        }
        @media(min-width:500px){.grid-buttons{grid-template-columns:repeat(6,1fr)}}
        @media(min-width:700px){.grid-buttons{grid-template-columns:repeat(8,1fr)}}
        .btn-ep {
            background-color:#27272a;
            color:white;
            padding:10px 4px;
            border:none;
            border-radius:8px;
            font-weight:bold;
            font-size:0.8rem;
            cursor:pointer;
            transition: 0.2s;
            text-align:center;
        }
        .btn-ep:hover { background:#00a3cc; }
        .video-box {
            margin-top:25px;
            width:100%;
            aspect-ratio:16/9;
            background:black;
            border-radius:15px;
            overflow:hidden;
            border:2px solid rgba(0,210,255,0.4);
        }
        iframe { width:100%; height:100%; border:none; }
        .hidden { display:none!important; }
        .info-msg {
            text-align:center;
            color:#a1a1aa;
            padding:20px;
            grid-column:1/-1;
        }
    </style>
</head>
<body>
    <header>
        <h1>STREAM PURO</h1>
        <div class="subtitle">Catálogo con Datos Reales</div>
    </header>

    <div class="panel">
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Buscar anime..." autofocus>
            <button id="searchBtn">BUSCAR</button>
        </div>

        <div style="text-align:center;margin-bottom:10px;">
            <button id="retryBtn" class="btn-sm">🔄 Reintentar portadas fallidas</button>
            <button id="backToCatBtn" class="btn-sm hidden">⬅ Volver al catálogo</button>
        </div>

        <div id="results" class="results-grid"></div>

        <div id="episodeMenu" class="menu-episodes hidden">
            <h2 id="animeTitle">Capítulos</h2>
            <div class="info-text" id="animeInfo"></div>
            <div id="episodeList" class="grid-buttons"></div>
        </div>

        <div id="videoContainer" class="video-box hidden">
            <iframe id="player" sandbox="allow-scripts allow-same-origin" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        var CATALOGO = [
            { titulo: "Naruto", caps: 220, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Naruto Shippuden", caps: 500, audio: "Japonés + Español parcial ⚠️", subtitulos: true },
            { titulo: "Dragon Ball Super", caps: 131, audio: "Japonés + Español parcial ⚠️", subtitulos: true },
            { titulo: "One Piece", caps: 1080, audio: "Japonés + Español parcial ⚠️", subtitulos: true },
            { titulo: "Demon Slayer", caps: 63, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Dragon Ball Z", caps: 291, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Dragon Ball", caps: 153, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Dragon Ball GT", caps: 64, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Boruto: Naruto Next Generations", caps: 293, audio: "Japonés + Español parcial ⚠️", subtitulos: true },
            { titulo: "Attack on Titan", caps: 89, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Death Note", caps: 37, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Hunter x Hunter (2011)", caps: 148, audio: "Japonés + Subs", subtitulos: true },
            { titulo: "Fullmetal Alchemist: Brotherhood", caps: 64, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Tokyo Ghoul", caps: 48, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Sword Art Online", caps: 96, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "One Punch Man", caps: 24, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Bleach", caps: 366, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Bleach: Thousand-Year Blood War", caps: 26, audio: "Japonés + Español parcial ⚠️", subtitulos: true },
            { titulo: "Fairy Tail", caps: 328, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Haikyuu!!", caps: 85, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Steins;Gate", caps: 24, audio: "Japonés + Subs", subtitulos: true },
            { titulo: "Re:Zero", caps: 50, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "KonoSuba", caps: 20, audio: "Japonés + Subs", subtitulos: true },
            { titulo: "Mob Psycho 100", caps: 37, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Vinland Saga", caps: 48, audio: "Japonés + Español parcial ⚠️", subtitulos: true },
            { titulo: "Dr. Stone", caps: 57, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Code Geass", caps: 50, audio: "Japonés + Subs", subtitulos: true },
            { titulo: "Cowboy Bebop", caps: 26, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Neon Genesis Evangelion", caps: 26, audio: "Japonés + Subs", subtitulos: true },
            { titulo: "Berserk (1997)", caps: 25, audio: "Japonés + Subs", subtitulos: true },
            { titulo: "Blue Lock", caps: 24, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Tokyo Revengers", caps: 50, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Kaguya-sama: Love is War", caps: 37, audio: "Japonés + Subs", subtitulos: true },
            { titulo: "Overlord", caps: 52, audio: "Japonés + Subs", subtitulos: true },
            { titulo: "No Game No Life", caps: 12, audio: "Japonés + Subs", subtitulos: true },
            { titulo: "Jujutsu Kaisen", caps: 47, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Chainsaw Man", caps: 12, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Spy x Family", caps: 37, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "My Hero Academia", caps: 138, audio: "Español Latino ✅", subtitulos: true },
            { titulo: "Black Clover", caps: 170, audio: "Español Latino ✅", subtitulos: true }
        ];

        var imageCache = {};
        var pendingQueue = [];
        var activeRequests = 0;
        var MAX_CONCURRENT = 1;
        var DELAY_ENTRE_PETICIONES = 600;
        var STORAGE_KEY = 'streampuro_portadas_v5';
        var animeSeleccionado = null;

        var PLACEHOLDER = function(titulo) {
            return 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22400%22%3E%3Crect fill=%22%231a1a2e%22 width=%22300%22 height=%22400%22/%3E%3Ctext fill=%22%2300d2ff%22 x=%2220%22 y=%22200%22 font-size=%2216%22%3E' + encodeURIComponent(titulo.substring(0,14)) + '%3C/text%3E%3C/svg%3E';
        };

        function cargarCachePersistente() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    var guardado = JSON.parse(raw);
                    for (var k in guardado) { imageCache[k] = guardado[k]; }
                }
            } catch (e) {}
        }
        function guardarCachePersistente() {
            try {
                var soloExitosas = {};
                for (var k in imageCache) {
                    if (imageCache[k] && imageCache[k] !== 'PENDING' && imageCache[k] !== 'ERROR') {
                        soloExitosas[k] = imageCache[k];
                    }
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(soloExitosas));
            } catch (e) {}
        }
        cargarCachePersistente();

        function esperar(ms) { return new Promise(function(resolve) { setTimeout(resolve, ms); }); }

        function buscarPortadaAniList(titulo, intento) {
            intento = intento || 0;
            var query = 'query ($search: String) { Page(perPage: 10) { media(search: $search, type: ANIME) { popularity coverImage { extraLarge large } title { romaji english } } } }';
            return fetch('https://graphql.anilist.co', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ query: query, variables: { search: titulo } })
            })
            .then(function(r) {
                if (r.status === 429 && intento < 5) {
                    var retryAfter = parseFloat(r.headers.get('Retry-After'));
                    var espera = (isNaN(retryAfter) ? (intento + 1) * 3 : retryAfter) * 1000;
                    return esperar(espera).then(function() {
                        return buscarPortadaAniList(titulo, intento + 1);
                    });
                }
                if (!r.ok) return null;
                return r.json().then(function(data) {
                    var lista = data && data.data && data.data.Page && data.data.Page.media;
                    if (!lista || lista.length === 0) return null;
                    var normalizar = function(s) { return (s || '').toLowerCase().trim(); };
                    var buscado = normalizar(titulo);
                    var exacto = lista.filter(function(m) {
                        var t = m.title || {};
                        return normalizar(t.english) === buscado || normalizar(t.romaji) === buscado;
                    })[0];
                    var elegido = exacto || lista.slice().sort(function(a, b) {
                        return (b.popularity || 0) - (a.popularity || 0);
                    })[0];
                    var img = elegido && elegido.coverImage && (elegido.coverImage.extraLarge || elegido.coverImage.large);
                    return img || null;
                });
            })
            .catch(function() { return null; });
        }

        function procesarCola() {
            while (activeRequests < MAX_CONCURRENT && pendingQueue.length > 0) {
                var job = pendingQueue.shift();
                activeRequests++;
                (function(job) {
                    buscarPortadaAniList(job.titulo).then(function(url) {
                        activeRequests--;
                        imageCache[job.titulo] = url || 'ERROR';
                        if (url) guardarCachePersistente();
                        actualizarImagenesEnPantalla(job.titulo, url);
                        esperar(DELAY_ENTRE_PETICIONES).then(procesarCola);
                    });
                })(job);
            }
        }

        function reintentarFallidas() {
            for (var t in imageCache) {
                if (imageCache[t] === 'ERROR') {
                    delete imageCache[t];
                    pendingQueue.push({ titulo: t });
                }
            }
            procesarCola();
        }

        function actualizarImagenesEnPantalla(titulo, url) {
            var nodos = document.querySelectorAll('.card[data-title="' + CSS.escape(titulo) + '"] .img-wrap');
            nodos.forEach(function(wrap) {
                var img = document.createElement('img');
                img.alt = titulo;
                img.loading = 'lazy';
                img.src = url || PLACEHOLDER(titulo);
                wrap.innerHTML = '';
                wrap.appendChild(img);
            });
        }

        function pedirImagen(titulo) {
            if (imageCache[titulo] === undefined) {
                imageCache[titulo] = 'PENDING';
                pendingQueue.push({ titulo: titulo });
                procesarCola();
            } else if (imageCache[titulo] !== 'PENDING') {
                actualizarImagenesEnPantalla(titulo, imageCache[titulo] === 'ERROR' ? null : imageCache[titulo]);
            }
        }

        var searchInput = document.getElementById('searchQuery');
        var searchBtn = document.getElementById('searchBtn');
        var resultsDiv = document.getElementById('results');
        var videoContainer = document.getElementById('videoContainer');
        var playerIframe = document.getElementById('player');
        var episodeMenu = document.getElementById('episodeMenu');
        var episodeTitle = document.getElementById('animeTitle');
        var episodeList = document.getElementById('episodeList');
        var animeInfo = document.getElementById('animeInfo');
        var backToCatBtn = document.getElementById('backToCatBtn');

        function mostrarCatalogo(filtro) {
            filtro = filtro || '';
            resultsDiv.innerHTML = '';
            resultsDiv.classList.remove('hidden');
            episodeMenu.classList.add('hidden');
            videoContainer.classList.add('hidden');
            backToCatBtn.classList.add('hidden');
            animeSeleccionado = null;

            var filtradas = CATALOGO.filter(function(anime) {
                return anime.titulo.toLowerCase().indexOf(filtro.toLowerCase()) !== -1;
            });

            if (filtradas.length === 0) {
                resultsDiv.innerHTML = '<div class="info-msg">No se encontró nada. Prueba otro nombre.</div>';
                return;
            }

            filtradas.forEach(function(anime) {
                var card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-title', anime.titulo);
                card.onclick = function() {
                    mostrarEpisodios(anime);
                };

                var wrap = document.createElement('div');
                wrap.className = 'img-wrap';
                var dot = document.createElement('div');
                dot.className = 'loading-dot';
                wrap.appendChild(dot);

                var title = document.createElement('h3');
                title.textContent = anime.titulo;

                var badge = document.createElement('div');
                badge.className = 'eps-badge';
                badge.textContent = anime.caps + ' caps · ' + anime.audio;

                card.appendChild(wrap);
                card.appendChild(title);
                card.appendChild(badge);
                resultsDiv.appendChild(card);

                pedirImagen(anime.titulo);
            });
        }

        function mostrarEpisodios(anime) {
            animeSeleccionado = anime;
            resultsDiv.classList.add('hidden');
            episodeMenu.classList.remove('hidden');
            videoContainer.classList.add('hidden');
            backToCatBtn.classList.remove('hidden');
            episodeTitle.textContent = anime.titulo;
            animeInfo.textContent = anime.caps + ' capítulos · ' + anime.audio;
            episodeList.innerHTML = '';

            var total = anime.caps;
            var mostrarMaximo = Math.min(total, 500);

            for (var i = 1; i <= mostrarMaximo; i++) {
                var btn = document.createElement('button');
                btn.className = 'btn-ep';
                btn.textContent = i;
                (function(epNum) {
                    btn.onclick = function() {
                        reproducirVideo(anime.titulo, epNum);
                    };
                })(i);
                episodeList.appendChild(btn);
            }

            if (total > 500) {
                var aviso = document.createElement('div');
                aviso.className = 'info-msg';
                aviso.textContent = 'Mostrando primeros 500 de ' + total + ' capítulos. Busca tu episodio en el buscador principal.';
                episodeList.appendChild(aviso);
            }

            episodeMenu.scrollIntoView({ behavior:'smooth', block:'nearest' });
        }

        function reproducirVideo(titulo, episodio) {
            var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;font-family:sans-serif;}h2{color:#00d2ff;text-align:center;margin-bottom:10px;}p{color:#a1a1aa;text-align:center;font-size:0.9rem;}.icon{font-size:4rem;margin-bottom:20px;}</style></head><body><div class="icon">🎬</div><h2>' + titulo + '</h2><p>Episodio ' + episodio + ' · Reproduciendo</p></body></html>';
            var blob = new Blob([html], {type:'text/html'});
            var blobUrl = URL.createObjectURL(blob);
            if (playerIframe.src && playerIframe.src.indexOf('blob:') === 0) {
                URL.revokeObjectURL(playerIframe.src);
            }
            playerIframe.src = blobUrl;
            videoContainer.classList.remove('hidden');
            videoContainer.scrollIntoView({ behavior:'smooth', block:'center' });
        }

        document.getElementById('retryBtn').addEventListener('click', reintentarFallidas);
        backToCatBtn.addEventListener('click', function() {
            mostrarCatalogo(searchInput.value.trim());
        });

        searchBtn.addEventListener('click', function() {
            mostrarCatalogo(searchInput.value.trim());
        });
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') mostrarCatalogo(searchInput.value.trim());
        });
        searchInput.addEventListener('input', function() {
            mostrarCatalogo(searchInput.value.trim());
        });

        mostrarCatalogo('');
    </script>
</body>
</html>
